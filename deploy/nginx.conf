# nginx site – copy to /etc/nginx/sites-available/techsara-santa and symlink into sites-enabled.
# Replace santa.techsarasolutions.com with your domain, then run certbot (see DEPLOY-EC2.md).
server {
    listen 80;
    server_name santa.techsarasolutions.com;

    # Photo uploads (5 MB each, bulk uploads send up to 10 at a time)
    client_max_body_size 60m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
